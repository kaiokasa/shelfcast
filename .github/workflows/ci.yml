name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies
        run: pip install -r requirements-app.txt pytest

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t shelfcast .

      - name: Check that the app starts and answers the health check
        run: |
          docker run -d --name app -p 8501:8501 shelfcast
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
