services:
  app:
    build: .
    image: shelfcast
    container_name: shelfcast
    ports:
      - "8501:8501"
    volumes:
      # Kaggle competition data, downloaded locally (see README), mounted read-only
      - ./Data:/app/Data:ro
    environment:
      # Ollama running on the host machine (optional: without it, the app uses template explanations)
      OLLAMA_HOST: http://host.docker.internal:11434
      # Model used for the explanations; empty = smallest (fastest) model installed in Ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Model used by the SQL agent ("Ask the data" tab); empty = smallest model that is installed
      AGENT_MODEL: ${AGENT_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
